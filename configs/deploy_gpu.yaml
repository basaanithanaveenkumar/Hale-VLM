# ============================================================
# Halo-VLM  —  Inference preset: CUDA
# ============================================================
# Weights are frozen and no training steps run. Exporting to ONNX / TensorRT / MLX / Qualcomm is
# configured by the pipeline files in configs/deploy/ (hale-vlm-deploy), not by this run config.

inherits: base.yaml

device: cuda

model:
  llm:
    dtype: bfloat16
    freeze_llm: true
  vision:
    freeze_encoder: true

train:
  steps: 0
